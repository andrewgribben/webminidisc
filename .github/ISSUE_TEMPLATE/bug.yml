name: "Bug"
description: "Record a reproducible defect and desired correction."
title: "[Bug] "
labels: ["planning", "type:bug"]
body:
  - type: markdown
    attributes:
      value: >-
        New issues enter planning, never the ready queue. During discovery,
        application implementation, scaffolding, and executable prototypes are prohibited.
        Only the named human owner may authorise implementation against an exact
        planning revision and a defined issue scope. This form is not approval.
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "Describe the defect and its impact."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction and environment"
      description: "Give steps, affected version/environment, and available evidence. State explicitly if not yet reproducible."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected and actual behaviour"
      description: "Describe both and the desired correction."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "Acceptance and verification"
      description: "How will the correction and relevant regressions be checked?"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Specification, epic, and decision links"
      description: "Link durable context accessible to local and remote agents. Note unresolved questions."
    validations:
      required: false
  - type: textarea
    id: approval
    attributes:
      label: "Phase approval reference"
      description: "For later implementation, link the owner decision and phase approval covering this issue, including the exact approved planning SHA. Leave blank while planning."
    validations:
      required: false
