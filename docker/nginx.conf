server {
    listen 8474 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Emscripten and ffmpeg.wasm use instantiateStreaming, which requires this type.
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # Same-origin proxy to the embedded Downtify (127.0.0.1:8000 unless overridden).
    # __DOWNTIFY_UPSTREAM__ is replaced at container start.
    location /downtify/ {
        proxy_pass __DOWNTIFY_UPSTREAM__/;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin proxy for the MiniDisc metadata library and saved WAV files.
    # __MD_LIBRARY_UPSTREAM__ is replaced at container start.
    location /md-library/ {
        client_max_body_size 1024m;
        proxy_pass __MD_LIBRARY_UPSTREAM__/;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
