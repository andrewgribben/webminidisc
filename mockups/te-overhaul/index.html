<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web MiniDisc Pro — TE Overhaul Visuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="kicker">Interface study · series 01 · high-fidelity visuals</p>
        <h1>web <span>minidisc</span> pro</h1>
        <p class="lede">
          Teenage Engineering–influenced industrial UI direction. Correct MiniDisc cartridge geometry,
          printable main / edge / box labels, album art on the deck, plus Downtify library browse and
          background playlist downloads.
        </p>
      </header>

      <ol class="frames">
        <li>
          <figure>
            <img src="./visuals/01-connect.jpg" alt="Connect screen with MiniDisc cartridge" width="1280" height="720" />
            <figcaption>
              <span class="num">01</span>
              <div>
                <strong>Connect</strong>
                <p>NetMD / Remote / HiMD with a real MiniDisc cartridge, not a CD.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/02-deck.jpg" alt="Deck now-playing with large album art" width="1280" height="720" />
            <figcaption>
              <span class="num">02</span>
              <div>
                <strong>Deck · now playing</strong>
                <p>Album art as a primary surface beside the LCD, transport, and tracklist.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/03-transfer.jpg" alt="Transfer encode mockup" width="1280" height="720" />
            <figcaption>
              <span class="num">03</span>
              <div>
                <strong>Transfer</strong>
                <p>Dropzone, SP / LP2 / LP4 modules, external encoder queue.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/04-label-studio.jpg" alt="Label Studio with MiniDisc main edge and box labels" width="1280" height="720" />
            <figcaption>
              <span class="num">04</span>
              <div>
                <strong>Label Studio · fixed album</strong>
                <p>Main cartridge label (dog-ear), edge strip, and case/box label.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/05-label-mix.jpg" alt="Label Studio mix disc generated labels" width="1280" height="720" />
            <figcaption>
              <span class="num">05</span>
              <div>
                <strong>Label Studio · mix disc</strong>
                <p>Generated artwork mapped onto main, edge, and box MiniDisc labels.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/06-library.jpg" alt="Disc archive library with MiniDisc cartridges" width="1280" height="720" />
            <figcaption>
              <span class="num">06</span>
              <div>
                <strong>Disc archives</strong>
                <p>Known MiniDiscs with cartridge face previews and label status.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/07-system.jpg" alt="System and factory settings" width="1280" height="720" />
            <figcaption>
              <span class="num">07</span>
              <div>
                <strong>System</strong>
                <p>Preferences, encoders, factory / dump / wipe behind an explicit gate.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/08-label-export-detail.jpg" alt="Printed MiniDisc label pack flat lay" width="1280" height="720" />
            <figcaption>
              <span class="num">08</span>
              <div>
                <strong>Export pack</strong>
                <p>Physical main label, edge strip, and MiniDisc box label deliverables.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/09-downtify-library.jpg" alt="Downtify music library browser" width="1280" height="720" />
            <figcaption>
              <span class="num">09</span>
              <div>
                <strong>Downtify · music library</strong>
                <p>Browse albums / artists / playlists / tracks, select, send to encode.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/10-downtify-playlist.jpg" alt="Downtify add playlist background download queue" width="1280" height="720" />
            <figcaption>
              <span class="num">10</span>
              <div>
                <strong>Downtify · add playlist</strong>
                <p>Queue Spotify/YouTube playlists for embedded background download.</p>
              </div>
            </figcaption>
          </figure>
        </li>
      </ol>
    </main>
  </body>
</html>
