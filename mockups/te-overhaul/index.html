<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web MiniDisc Pro — TE Overhaul Visuals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="kicker">Interface study · series 01 · high-fidelity visuals</p>
        <h1>web <span>minidisc</span> pro</h1>
        <p class="lede">
          Teenage Engineering–influenced industrial UI direction for a Web MiniDisc Pro overhaul.
          Core fork workflows plus Label Studio for disc/title export and printable faces.
        </p>
      </header>

      <ol class="frames">
        <li>
          <figure>
            <img src="./visuals/01-connect.jpg" alt="Connect screen mockup" width="1280" height="720" />
            <figcaption>
              <span class="num">01</span>
              <div>
                <strong>Connect</strong>
                <p>NetMD USB, Remote NetMD, HiMD — product chassis welcome.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/02-deck.jpg" alt="Deck tracklist mockup" width="1280" height="720" />
            <figcaption>
              <span class="num">02</span>
              <div>
                <strong>Deck</strong>
                <p>LCD transport, grouped tracks, capacity, recognize / download.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/03-transfer.jpg" alt="Transfer encode mockup" width="1280" height="720" />
            <figcaption>
              <span class="num">03</span>
              <div>
                <strong>Transfer</strong>
                <p>Dropzone, SP / LP2 / LP4 modules, external encoder queue.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/04-label-album.jpg" alt="Label Studio fixed album mockup" width="1280" height="720" />
            <figcaption>
              <span class="num">04</span>
              <div>
                <strong>Label Studio · fixed album</strong>
                <p>Cover-art face, spine + TOC export pack.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/05-label-mix.jpg" alt="Label Studio mix disc mockup" width="1280" height="720" />
            <figcaption>
              <span class="num">05</span>
              <div>
                <strong>Label Studio · mix disc</strong>
                <p>Generated geometric artwork from titles, codecs, energy.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/06-library.jpg" alt="Disc library mockup" width="1280" height="720" />
            <figcaption>
              <span class="num">06</span>
              <div>
                <strong>Library</strong>
                <p>Known discs, archives, recognition and Downtify hooks.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/07-system.jpg" alt="System and factory mockup" width="1280" height="720" />
            <figcaption>
              <span class="num">07</span>
              <div>
                <strong>System</strong>
                <p>Preferences, encoders, factory / dump / wipe behind an explicit gate.</p>
              </div>
            </figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="./visuals/08-label-export-detail.jpg" alt="Label export deliverables mockup" width="1280" height="720" />
            <figcaption>
              <span class="num">08</span>
              <div>
                <strong>Export pack</strong>
                <p>Physical face label, spine strip, TOC sheet deliverables.</p>
              </div>
            </figcaption>
          </figure>
        </li>
      </ol>
